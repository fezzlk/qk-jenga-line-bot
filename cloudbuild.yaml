steps:
  # Step 1: Docker build
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      # TODO: 必要に応じて --build-arg を追加
      - "-t=asia-northeast1-docker.pkg.dev/qk-jenga-line-bot/cloud-run-source-deploy/qk-jenga-line-bot:$COMMIT_SHA"
      - "-t=asia-northeast1-docker.pkg.dev/qk-jenga-line-bot/cloud-run-source-deploy/qk-jenga-line-bot:latest"
      - "."

  # Step 2: Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    waitFor: ["build"]
    args:
      - "push"
      - "--all-tags"
      - "asia-northeast1-docker.pkg.dev/qk-jenga-line-bot/cloud-run-source-deploy/qk-jenga-line-bot"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    waitFor: ["push"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "qk-jenga-line-bot"
      - "--image=asia-northeast1-docker.pkg.dev/qk-jenga-line-bot/cloud-run-source-deploy/qk-jenga-line-bot:$COMMIT_SHA"
      - "--region=asia-northeast1"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--allow-unauthenticated"
      - "--service-account=qk-jenga-line-bot-run@qk-jenga-line-bot.iam.gserviceaccount.com"
      # デプロイ前に、Secret Managerへ以下2つのシークレットを作成しておくこと（このリポジトリの
      # コードは作成しない。gcloud secrets create line-channel-secret / line-channel-access-token）。
      - "--update-secrets=LINE_CHANNEL_SECRET=line-channel-secret:latest,LINE_CHANNEL_ACCESS_TOKEN=line-channel-access-token:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
