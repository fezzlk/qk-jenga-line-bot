services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8085
      - GOOGLE_CLOUD_PROJECT=qk-jenga-line-bot-local
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    depends_on:
      - firestore-emulator

  firestore-emulator:
    # Official Google image with the JRE the Firestore emulator needs
    # (a plain node:alpine image cannot run it, since it's a Java process).
    image: google/cloud-sdk:emulators
    ports:
      - "8085:8085"
    command: >
      gcloud emulators firestore start --host-port=0.0.0.0:8085 --project=qk-jenga-line-bot-local
